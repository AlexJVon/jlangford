# Publishes every branch as its own preview version.
#   main            ->  https://<user>.github.io/<repo>/
#   any-other-name  ->  https://<user>.github.io/<repo>/v/any-other-name/
# Output goes to the gh-pages branch (Settings → Pages → Branch: gh-pages / root).
name: Publish all versions

on:
  push:
    branches-ignore: [gh-pages]
  delete:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-versions
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Build every branch into _site
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash tools/build-versions.sh

      - name: Push to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Publish versions from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
