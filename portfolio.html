<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <title>Portfolio — Jennifer Langford, AIA, CNU, PA</title>
  <meta name="description" content="Residential, mixed-use, commercial, LEED® certified and New Urbanist neighborhood projects by Jennifer Langford, AIA, CNU, PA.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
</head>
<body>
<header class="site-header" data-current="portfolio"></header>
<script src="js/layout.js"></script>

<main id="main">
  <section class="page-head">
    <div class="wrap">
      <p class="eyebrow">Portfolio</p>
      <h1>Built work</h1>
      <p>Homes, <span class="term" data-term="mixed-use">mixed-use</span> buildings and whole neighborhoods across Florida, Georgia and the Southeast. Tap any project for the full photo gallery — projects marked <strong>Drawings</strong> also have plans and specifications in the <a href="plans.html">Plan Library</a>.</p>
    </div>
  </section>

  <section class="wrap" style="padding-bottom: clamp(56px, 9vw, 120px)">
    <div class="filters" id="filters" role="group" aria-label="Filter by project type"></div>
    <div class="grid" id="projects"></div>
  </section>
</main>

<footer class="site-footer"></footer>
<script src="js/glossary.js"></script>
<script src="js/projects.js"></script>
<script src="js/plans.js"></script>
<script src="js/site.js"></script>
<script>
  (function () {
    var grid = document.getElementById("projects");
    var filters = document.getElementById("filters");
    var cards = PROJECTS.map(function (p) {
      var c = projectCard(p);
      c.dataset.cat = p.category;
      if (planForProject(p.id)) {
        var tag = document.createElement("span");
        tag.className = "card__count"; tag.style.left = "10px"; tag.style.right = "auto";
        tag.style.background = "rgba(47,74,99,.9)"; tag.textContent = "Drawings";
        c.querySelector(".card__img").appendChild(tag);
      }
      grid.appendChild(c);
      return c;
    });

    var all = [{ slug: "", label: "All" }].concat(CATEGORIES.filter(function (c) {
      return PROJECTS.some(function (p) { return p.category === c.slug; });
    }));
    var buttons = all.map(function (c) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "filter"; b.textContent = c.label; b.dataset.slug = c.slug;
      b.addEventListener("click", function () { setFilter(c.slug, true); });
      filters.appendChild(b);
      return b;
    });

    function setFilter(slug, push) {
      buttons.forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.slug === slug); });
      cards.forEach(function (c) { c.hidden = slug && c.dataset.cat !== slug; });
      if (push) history.replaceState(null, "", slug ? "#" + slug : location.pathname);
      reveal();
    }

    var hash = location.hash.slice(1);
    setFilter(all.some(function (c) { return c.slug === hash; }) ? hash : "", false);
    prepTerms(); reveal(); openFromHash();
  })();
</script>
</body>
</html>
